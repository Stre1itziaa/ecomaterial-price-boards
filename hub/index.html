<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看板导航 · 本地总入口</title>
<style>
  /* ============ 全站设计系统 v1(boards/_shared/design-system.md) ============ */
  :root{
    --bg:#fafafa; --card:#fff; --line:#e5e5e5; --line-2:#f4f4f5;
    --txt:#18181b; --sub:#737373; --sub-dim:rgba(24,24,27,.45);
    --blue:#4f46e5; --blue-dk:#4338ca; --blue-bg:#eef2ff; --blue-bg2:#f5f7ff;
    --red:#dc2626; --green:#059669; --amber:#d97706;
    --row-hover:#f4f4f5;
    --r-card:12px; --r-btn:8px; --r-pill:999px;
    --s-card:0 1px 2px rgba(0,0,0,.04);
    --s-hover:0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.08);
    --ease:cubic-bezier(.215,.61,.355,1); --t-fast:.12s; --t-mid:.18s;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--txt);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size: 13px; min-height: 100vh; padding: 34px 26px 40px;
  }
  .wrap { max-width: 1160px; margin: 0 auto; }
  a { text-decoration: none; color: inherit; }

  /* ---- 页头三段式(§3.2) ---- */
  header { display:flex; align-items:flex-start; gap:16px; margin-bottom:10px; }
  header h1 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  header .sub { color: var(--sub); font-size: 13px; margin-top: 6px; }
  header .sub b { color: var(--txt); font-weight: 600; }
  .clock { margin-left:auto; text-align:right; flex-shrink:0; }
  .clock .t { font-size: 21px; font-weight:700; font-variant-numeric: tabular-nums; letter-spacing:-.01em; }
  .clock .d { font-size: 12px; color: var(--sub); margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* ---- 服务状态带(§3.7,每板一点,直达) ---- */
  .statusbar { display:flex; align-items:center; gap:4px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    box-shadow:var(--s-card); padding:8px 12px; margin-bottom:8px; }
  .statusbar .lbl { font-size:11px; color:var(--sub-dim); margin-right:6px; }
  .schip { display:inline-flex; align-items:center; gap:6px; padding:3px 10px;
    border-radius:var(--r-pill); font-size:11.5px; color:var(--sub); cursor:pointer;
    transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .schip:hover { background:var(--blue-bg2); color:var(--blue-dk); }
  .schip i { width:7px; height:7px; border-radius:50%; background:#d4d4d8; flex-shrink:0;
    transition:background var(--t-mid) var(--ease); }
  .schip.on i { background:#10b981; }
  .schip.off { color:#b91c1c; } .schip.off i { background:var(--red); }
  .schip.wait i { background:#fbbf24; }

  /* ---- 分区(§3.7: sentence case, 无 uppercase/字距) ---- */
  h2.section { font-size: 12.5px; font-weight: 600; color: var(--sub);
    margin: 22px 2px 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }

  /* ---- 卡片(§3.3: 白卡/细边/轻影/hover 换影不动 transform; 卡头 border-b=dub 手法) ---- */
  a.card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-card); box-shadow: var(--s-card);
    transition: box-shadow var(--t-mid) var(--ease), border-color var(--t-mid) var(--ease);
    position: relative; overflow: hidden;
  }
  a.card:hover { box-shadow: var(--s-hover); border-color:#d4d4d8; }
  .chead { display:flex; align-items:center; gap:8px; padding:10px 16px;
    border-bottom:1px solid var(--line-2); }
  .bdg { display:inline-flex; align-items:center; gap:5px; padding:2px 9px;
    border-radius:var(--r-pill); font-size:11px; white-space:nowrap; }
  .bdg i { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .bdg.live { background:#ecfdf5; color:#047857; } .bdg.live i { background:#10b981; }
  .bdg.dead { background:#f4f4f5; color:#71717a; } .bdg.dead i { background:#a1a1aa; }
  .bdg.warn { background:#fffbeb; color:#b45309; } .bdg.warn i { background:#fbbf24; }
  .port { margin-left:auto; font-size: 11px; color: var(--sub);
    font-variant-numeric: tabular-nums; background: var(--bg);
    border: 1px solid var(--line-2); padding: 1px 8px; border-radius: var(--r-pill); }
  .cbody { padding: 12px 16px 14px; display:flex; flex-direction:column; flex:1; }
  .card .title { font-size: 16.5px; font-weight: 600; letter-spacing:-.01em; margin-bottom: 6px; }
  .card .desc { font-size: 12.5px; color: var(--sub); line-height: 1.6; }
  .brief { margin-top: 10px; font-size: 12px; line-height: 1.55; color: var(--txt);
    display:none; align-items:flex-start; gap:7px; }
  .brief.show { display:flex; }
  .brief .bp { width:6px; height:6px; border-radius:50%; background:var(--accent,#a1a1aa);
    flex-shrink:0; margin-top:5px; }
  .asofline { margin-top: 6px; font-size: 11px; color: var(--sub-dim);
    font-variant-numeric: tabular-nums; }
  .cfoot { margin-top:auto; padding-top: 12px; display:flex; align-items:center; }
  .card .go { margin-left:auto; font-size: 12.5px; font-weight: 500; color: var(--sub);
    transition: color var(--t-fast) var(--ease); }
  a.card:hover .go { color: var(--accent, var(--blue)); }
  .card .go .arr { display: inline-block; transition: transform var(--t-mid) var(--ease); }
  a.card:hover .go .arr { transform: translateX(3px); }
  a.card.off { opacity: .55; }
  a.card.off, a.card.off .go { cursor: not-allowed; }
  a.card.off:hover { box-shadow: var(--s-card); border-color: var(--line); }

  footer { margin-top: 30px; color: var(--sub-dim); font-size: 12px; line-height: 1.8; }
  footer code { background: var(--card); border: 1px solid var(--line-2);
    padding: 1px 6px; border-radius: 6px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>看板导航</h1>
      <div class="sub">本地常驻看板总入口 · <b id="online-stat">探测中…</b> · 状态每 15 秒自动探测 · 点卡片直达</div>
    </div>
    <div class="clock">
      <div class="t" id="clock-t">--:--</div>
      <div class="d" id="clock-d"></div>
    </div>
  </header>

  <div class="statusbar" id="statusbar"><span class="lbl">服务</span></div>

  <h2 class="section">价格追踪</h2>
  <div class="grid" id="grid-price"></div>

  <h2 class="section">量化与研究</h2>
  <div class="grid" id="grid-tools"></div>

  <footer>
    所有看板由 <code>start-dashboards.py</code> 登录自启守护；数据由各项目 schtasks 每日刷新。<br>
    新增看板：在 <code>start-dashboards.py</code> 的 BOARDS 加一行，并在本页 <code>BOARDS</code> 数组加一张卡片。
  </footer>
</div>

<script>
const PRICE = [
  { port: 8790, path: "/storage/", accent: "#1f77b4", short: "存储", title: "存储价格追踪",
    desc: "CFM × TrendForce 双源 · DRAM / NAND / SSD / 内存条 137 品 + HDD 企业盘三档（New/翻新/Recertified）零售价与涨跌榜" },
  { port: 8792, path: "/mlcc/", accent: "#d9822b", short: "MLCC", title: "MLCC 价格追踪",
    desc: "云汉 × 立创 双源零售现货 · 18 条料号序列，起订档单价 + 库存信号 + 阶梯价审计" },
  { port: 8793, path: "/fabric/", accent: "#0d9488", short: "电子布", title: "电子布 / 覆铜板",
    desc: "涨价锚点台账（现货/原厂调价/财报/交期）+ 527 条公司公告流 · AI 硬件上游供给" },
  { port: 8794, path: "/signal/", accent: "#7c3aed", short: "AI信号", title: "AI 需求与退出信号板",
    desc: "CSP capex 上修轨迹台账+ ABF 载板锚点（双转述纪律）+ 全清单退出日历 · 人工台账更新" },
  { port: 8798, path: "/rental/", accent: "#059669", short: "租价", title: "算力租价板",
    desc: "GPU 算力租赁七源日频（RunPod/Nebius/Lambda $ + 智星云/优云/PPIO ¥）+ 整机成交散点 + 中标公告流 · 每日 19:40 刷新" },
];
const TOOLS = [
  { port: 8796, path: "/factor/", accent: "#0e7490", short: "因子监测", title: "因子失效监测台",
    desc: "qb.factors 14 风格因子 + synth 模型分 · 失效时间线与失效集归因 · 六大类健康带（可框选区间看生效/失效）· 滚动 IC / 参考带 z 值 / 拥挤度三比率 · 每日 19:20 刷新" },
  { port: 8797, path: "/scenario/", accent: "#8c564b", short: "情景推演", title: "情景推演台",
    desc: "多情景股价轨迹推演（净利×PE÷股本）· 一致预期 min/avg/max 三档锚 · 参数拖调实时重算 + 一键导出 YAML · 审计门 / PE band / football field · 每日 19:45 刷新" },
  { port: 8802, accent: "#4f46e5", short: "模拟盘", title: "因子候选模拟盘总看板",
    desc: "全部因子纸面组合合一:沪深300 GP+LLM 合成组合 / dresid 残差 top-50 / chanlun bi_slope_z top-20 · 净值×基准×相对 · 候选总台账与季度检查点 · 实时聚合" },
  { port: 8804, accent: "#b45309", short: "研究室", title: "投资研究室 · 三agent黑板",
    desc: "三位 AI 投资者(t1 隔日/周线/月线)的圆桌黑板:每交易日晨班/尾班真实看市与检索,输出观点与纸面决策建议 · 私有记忆各自成长 · 决策执行权在老板" },
  { port: 8765, accent: "#7c3aed", short: "交割单", title: "交割单 · 交易日志",
    desc: "交易决策口述录入与复盘台账" },
  { port: 8803, accent: "#e0a87e", short: "SPECTRA", title: "SPECTRA 听音室",
    desc: "高保真可视化音乐播放器 · 实时频谱(倒置 dBFS/对数轴/峰值保持) + RMS 响度条带 + 波形时间线 · FLAC/MP3/M4A/OGG 元数据与封面 · LRC 双语歌词 · 深/浅双主题" },
];
// 本地=127.0.0.1/localhost(探测端口活性);部署态(vercel 等)=卡片直链子路径,不探测
const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);

function cardHTML(b) {
  const href = LOCAL ? `http://127.0.0.1:${b.port}/` : (b.path || "");
  return `
  <a class="card" id="card-${b.port}" style="--accent:${b.accent}" ${href ? `href="${href}"` : ""} target="_blank">
    <div class="chead">
      <span class="bdg dead" id="stwrap-${b.port}"><i id="dot-${b.port}"></i><span id="st-${b.port}">检测中</span></span>
      <span class="port">:${b.port}</span>
    </div>
    <div class="cbody">
      <div class="title">${b.title}</div>
      <div class="desc">${b.desc}</div>
      <div class="brief" id="brief-${b.port}"><i class="bp"></i><span id="brief-${b.port}-t"></span></div>
      <div class="asofline" id="asof-${b.port}"></div>
      <div class="cfoot"><span class="go"><span id="go-${b.port}">打开看板</span> <span class="arr">→</span></span></div>
    </div>
  </a>`;
}
document.getElementById("grid-price").innerHTML = PRICE.map(cardHTML).join("");
document.getElementById("grid-tools").innerHTML = TOOLS.map(cardHTML).join("");
document.getElementById("statusbar").insertAdjacentHTML("beforeend",
  PRICE.concat(TOOLS).map(b=>
    `<span class="schip wait" id="schip-${b.port}" title=":${b.port} ${b.title}" ${b.path&&LOCAL?`data-href="http://127.0.0.1:${b.port}/"`:(b.path?`data-href="${b.path}"`:"")}>
      <i></i>${b.short}</span>`).join(""));
document.getElementById("statusbar").querySelectorAll(".schip[data-href]").forEach(s=>
  s.addEventListener("click",()=>{ window.open(s.dataset.href, "_blank"); }));

function setState(b, ok, label){
  const wrap = document.getElementById("stwrap-"+b.port);
  const dot = document.getElementById("dot-"+b.port);
  const st = document.getElementById("st-"+b.port);
  wrap.className = "bdg " + (ok ? "live" : "dead");
  dot.className = "";
  st.textContent = label;
  const chip = document.getElementById("schip-"+b.port);
  chip.className = "schip " + (ok ? "on" : "off");
}

async function probe(port) {
  try {
    await fetch(`http://127.0.0.1:${port}/`, { mode: "no-cors", cache: "no-store" });
    return true;
  } catch (e) { return false; }
}
async function refresh() {
  const all = PRICE.concat(TOOLS);
  let on = 0;
  if (!LOCAL) {
    // 部署态:发布的看板全视为在线;未发布的工具卡标"仅本机"
    for (const b of all) {
      const published = !!b.path;
      if (published) on++;
      const card = document.getElementById("card-" + b.port);
      const go = document.getElementById("go-" + b.port);
      card.classList.toggle("off", !published);
      if (!published) card.removeAttribute("href");
      setState(b, published, published ? "在线" : "仅本机");
      go.textContent = published ? "打开看板" : "仅本机可用";
    }
    document.getElementById("online-stat").textContent = `${on}/${all.length} 个看板在线`;
    return;
  }
  for (const b of all) {
    const up = await probe(b.port);
    if (up) on++;
    const card = document.getElementById("card-" + b.port);
    const go = document.getElementById("go-" + b.port);
    if (up) {
      card.classList.remove("off");
      if (!card.href) card.href = `http://127.0.0.1:${b.port}/`;
    } else {
      card.classList.add("off");
      card.removeAttribute("href");
    }
    setState(b, up, up ? "在线" : "离线");
    go.textContent = up ? "打开看板" : "离线 · 点不动";
  }
  document.getElementById("online-stat").textContent = `${on}/${all.length} 个服务在线`;
}
async function loadSummary() {
  // 本地走 API;部署态(Vercel)退回 dayend 发布的静态 summary.json
  let j = null;
  try {
    const r = await fetch("/api/summary", { cache: "no-store" });
    if (r.ok) j = await r.json();
  } catch (e) { /* 本地 API 不在 */ }
  if (!j) {
    try {
      const r = await fetch("summary.json", { cache: "no-store" });
      if (r.ok) j = await r.json();
    } catch (e) { /* 双双缺席则隐藏要点 */ }
  }
  if (!j) return;
  for (const b of PRICE) {
    const s = j[b.port] || j[String(b.port)];
    const el = document.getElementById("brief-" + b.port);
    const elT = document.getElementById("brief-" + b.port + "-t");
    const as = document.getElementById("asof-" + b.port);
    if (s && s.ok) {
      el.classList.add("show");
      elT.textContent = s.headline;
      as.textContent = `数据截至 ${s.asof || "—"} · 下期刷新 ${s.nxt}`;
    } else {
      el.classList.remove("show");
      elT.textContent = "";
      as.textContent = "";
    }
  }
}
refresh(); setInterval(refresh, 15000);
loadSummary(); setInterval(loadSummary, 300000);

function tick() {
  const n = new Date();
  const p = x => String(x).padStart(2, "0");
  document.getElementById("clock-t").textContent = p(n.getHours()) + ":" + p(n.getMinutes()) + ":" + p(n.getSeconds());
  document.getElementById("clock-d").textContent =
    n.getFullYear() + "-" + p(n.getMonth() + 1) + "-" + p(n.getDate()) + " 周" + "日一二三四五六"[n.getDay()];
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
